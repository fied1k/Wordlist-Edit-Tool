name: Build & Release Standalone Binaries

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Standalone Executables
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Native C Acceleration Engine (DLL & CLI)
        shell: powershell
        run: |
          gcc -O3 -shared -o fastfilter.dll fastfilter.c
          if (-not (Test-Path "dist")) { New-Item -ItemType Directory -Path "dist" }
          gcc -O3 -DBUILD_CLI -o dist\fastfilter.exe fastfilter.c

      - name: Build Standalone GUI Executable (PyInstaller)
        shell: powershell
        run: |
          python -m PyInstaller --clean -y Wordlist-Edit-Tool.spec

      - name: Verify Compiled Binaries
        shell: powershell
        run: |
          .\dist\fastfilter.exe --version
          Get-ChildItem -Path .\dist

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wordlist-edit-tool-windows-binaries
          path: |
            dist/Wordlist-Edit-Tool.exe
            dist/fastfilter.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Wordlist-Edit-Tool.exe
            dist/fastfilter.exe
          generate_release_notes: true
          draft: false
          prerelease: false
